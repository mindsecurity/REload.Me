[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "reloadme"
version = "0.1.0"
description = "ReloadMe - Static-first reverse engineering assistant CLI"
readme = "README.md"
requires-python = ">=3.9"
authors = [{ name = "ReloadMe Team" }]
dependencies = [
  "typer>=0.9",
  "rich>=13.0",
  "pefile>=2023.2.7",
  "r2pipe>=1.6.0",
  "openai>=0.28.0",
]

[project.scripts]
reloadme = "reloadme.main:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["reloadme*"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
